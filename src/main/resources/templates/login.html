<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://images.unsplash.com/photo-1601758173926-cd8b3cfb5eb8?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #fff;
      font-size: 2rem;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }
    input:focus {
      border: 2px solid #34D399;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #34D399;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #28B788;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      color: #ffcccc;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      resize: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h2 style="color: black">Login</h2>
  <form th:action="@{/web/login}" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div class="message" th:text="${message}"></div>
  <div th:if="${token}">
    <p style="color:white; font-weight:bold; margin-top:15px;">JWT Token:</p>
    <textarea rows="4" th:text="${token}"></textarea>
  </div>
</div>
</body>
</html>
