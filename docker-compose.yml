services:
  mysql:
    image: mysql:8.1
    container_name: green-energy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Db@12345
      MYSQL_DATABASE: green_energy
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: green-energy-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/green_energy
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Db@12345
    depends_on:
      - mysql

volumes:
  mysql-data:
